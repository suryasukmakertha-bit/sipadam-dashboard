name: Siapkan Batas Kecamatan Buleleng

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository SIPADAM
        uses: actions/checkout@v4

      # Diambil LANGSUNG dari layanan resmi Badan Informasi Geospasial (BIG),
      # server-ke-server lewat GitHub Actions — supaya tidak kena blokir CORS
      # yang terjadi kalau diminta langsung dari browser dashboard.
      #
      # Field & filter di bawah (WADMKC, KDPKAB='51.08') sudah diverifikasi
      # manual lewat query BIG pada sesi sebelumnya: hasilnya persis 9
      # kecamatan Buleleng (Gerokgak, Seririt, Busungbiu, Banjar, Sukasada,
      # Buleleng, Sawan, Kubutambahan, Tejakula) dengan nama field itu.
      #
      # Sumber sebelumnya (dmxsan/indonesia-admin-boundaries) TERNYATA hanya
      # berisi batas level kabupaten/kota (9 fitur untuk seluruh Bali),
      # bukan kecamatan — makanya run sebelumnya gagal dengan "Feature
      # Buleleng: 0". Diganti total ke BIG sebagai sumber tunggal yang sudah
      # terbukti benar.
      - name: Download batas kecamatan Buleleng dari BIG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          URL="https://geoservices.big.go.id/rbi/rest/services/BATASWILAYAH/BATAS_KECAMATAN_AR/MapServer/0/query?where=KDPKAB%3D%2751.08%27&outFields=WADMKC%2CWADMKK%2CWADMPR%2CKDPKAB&returnGeometry=true&outSR=4326&f=geojson"

          # Server BIG menolak permintaan tanpa identitas seperti browser
          # (curl polos kena "Empty reply from server") — jadi disamarkan
          # sedikit di sini. Ini tetap tidak menjamin lolos kalau BIG
          # memblokir berdasarkan alamat IP server GitHub Actions, bukan
          # cuma berdasarkan header permintaan.
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 180 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Referer: https://geoservices.big.go.id/" \
            "$URL" \
            -o /tmp/buleleng-raw.geojson

          test -s /tmp/buleleng-raw.geojson

          echo "Ukuran file:"
          ls -lh /tmp/buleleng-raw.geojson

      - name: Validasi & simpan GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("/tmp/buleleng-raw.geojson")
          dst = Path("data/buleleng-kecamatan.geojson")

          expected = {
              "GEROKGAK", "SERIRIT", "BUSUNGBIU", "BANJAR", "SUKASADA",
              "BULELENG", "SAWAN", "KUBUTAMBAHAN", "TEJAKULA",
          }

          data = json.loads(src.read_text(encoding="utf-8"))

          if data.get("type") != "FeatureCollection":
              raise SystemExit(
                  "Respons BIG bukan FeatureCollection — kemungkinan layanan "
                  "mengembalikan pesan error, bukan data geometri. Isi respons:\n"
                  + json.dumps(data)[:500]
              )

          features = data.get("features", [])
          print("Total fitur dari BIG:", len(features))

          found = set()
          for f in features:
              props = f.get("properties", {})
              name = str(props.get("WADMKC", "")).strip().upper()
              if name:
                  found.add(name)

          print("Kecamatan ditemukan:", sorted(found))

          missing = expected - found
          if missing:
              raise SystemExit(
                  "Kecamatan belum lengkap, hilang: " + ", ".join(sorted(missing))
              )

          if len(features) != 9:
              raise SystemExit(
                  f"ERROR: seharusnya tepat 9 fitur kecamatan, ditemukan {len(features)}"
              )

          dst.write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print("GeoJSON berhasil disimpan:", dst, "-", dst.stat().st_size, "bytes")
          PY

      - name: Simpan sumber data
        shell: bash
        run: |
          cat > data/buleleng-kecamatan-source.json <<'EOF'
          {
            "dataset": "Batas administrasi kecamatan Kabupaten Buleleng",
            "source": "Badan Informasi Geospasial (BIG) - layanan RBI BATAS_KECAMATAN_AR",
            "source_url": "https://geoservices.big.go.id/rbi/rest/services/BATASWILAYAH/BATAS_KECAMATAN_AR/MapServer/0",
            "filter": "KDPKAB='51.08' (Kabupaten Buleleng)",
            "kabupaten_code_note": "BIG menulis kode kabupaten dengan format '51.08' (bertitik), bukan '5108'",
            "province_code": "51",
            "format": "GeoJSON",
            "crs": "WGS84 / EPSG:4326",
            "status": "STABIL - diambil langsung dari BIG lewat GitHub Actions (server-side) untuk menghindari blokir CORS di browser",
            "field_kecamatan": "WADMKC"
          }
          EOF

      - name: Commit GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/buleleng-kecamatan.geojson
          git add data/buleleng-kecamatan-source.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan file."
            exit 0
          fi

          git commit -m "Update Buleleng district GeoJSON boundary (sumber: BIG langsung)"
          git push
