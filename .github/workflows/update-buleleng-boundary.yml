name: Siapkan Batas Kecamatan Buleleng

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository SIPADAM
        uses: actions/checkout@v4

      - name: Download GeoJSON Bali
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 180 \
            "https://raw.githubusercontent.com/dmxsan/indonesia-admin-boundaries/main/processed-data/02-provinces/with-districts/Bali.geojson" \
            -o /tmp/Bali.geojson

          test -s /tmp/Bali.geojson

          echo "Ukuran file:"
          ls -lh /tmp/Bali.geojson

      - name: Ambil hanya Kecamatan Kabupaten Buleleng
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json

          src = "/tmp/Bali.geojson"
          dst = "data/buleleng-kecamatan.geojson"

          expected = {
              "GEROKGAK",
              "SERIRIT",
              "BUSUNGBIU",
              "BANJAR",
              "SUKASADA",
              "BULELENG",
              "SAWAN",
              "KUBUTAMBAHAN",
              "TEJAKULA",
          }

          with open(src, "r", encoding="utf-8") as f:
              data = json.load(f)

          features = data.get("features", [])

          print("Total feature Bali:", len(features))

          selected = []

          for feature in features:
              props = feature.get("properties", {})

              values = {
                  str(k).upper(): str(v).upper()
                  for k, v in props.items()
                  if v is not None
              }

              combined = " | ".join(values.values())

              district_name = None

              for key in (
                  "DISTRICT",
                  "DISTRICT_NAME",
                  "KECAMATAN",
                  "KECAMATAN_NAME",
                  "WADMKC",
                  "NAMOBJ",
                  "NAME",
                  "NAME_3",
                  "NAME_2",
              ):
                  if key in values:
                      candidate = values[key].strip()
                      if candidate in expected:
                          district_name = candidate
                          break

              if district_name:
                  selected.append(feature)

          print("Feature Buleleng:", len(selected))

          actual = set()

          for feature in selected:
              props = feature.get("properties", {})

              for key in (
                  "DISTRICT",
                  "DISTRICT_NAME",
                  "KECAMATAN",
                  "KECAMATAN_NAME",
                  "WADMKC",
                  "NAMOBJ",
                  "NAME",
                  "NAME_3",
                  "NAME_2",
              ):
                  value = props.get(key)
                  if value:
                      value = str(value).strip().upper()
                      if value in expected:
                          actual.add(value)

          print("Kecamatan ditemukan:")
          for x in sorted(actual):
              print(" -", x)

          missing = expected - actual

          if missing:
              raise SystemExit(
                  "Kecamatan belum lengkap: "
                  + ", ".join(sorted(missing))
              )

          result = {
              "type": "FeatureCollection",
              "features": selected
          }

          with open(dst, "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, separators=(",", ":"))

          print("GeoJSON berhasil dibuat:", dst)
          PY

      - name: Validasi akhir GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/buleleng-kecamatan.geojson")

          if not path.exists():
              raise SystemExit("File GeoJSON tidak ditemukan")

          if path.stat().st_size == 0:
              raise SystemExit("File GeoJSON kosong")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("type") != "FeatureCollection":
              raise SystemExit("Bukan FeatureCollection")

          count = len(data.get("features", []))

          print("Jumlah feature:", count)

          if count != 9:
              raise SystemExit(
                  f"ERROR: seharusnya 9 kecamatan Buleleng, ditemukan {count}"
              )

          print("VALIDASI BERHASIL")
          PY

      - name: Simpan sumber data
        shell: bash
        run: |
          cat > data/buleleng-kecamatan-source.json <<'EOF'
          {
            "dataset": "Batas administrasi kecamatan Bali",
            "source_repository": "dmxsan/indonesia-admin-boundaries",
            "source_claim": "Derived from official shapefiles provided by Badan Informasi Geospasial (BIG)",
            "source_file": "processed-data/02-provinces/with-districts/Bali.geojson",
            "area": "Kabupaten Buleleng",
            "province_code": "51",
            "kabupaten_code": "5108",
            "format": "GeoJSON",
            "crs": "WGS84 / EPSG:4326",
            "status": "INTERIM",
            "note": "Digunakan sebagai asset lokal sementara. Bukan salinan langsung BATAS_KECAMATAN_AR_2026 milik BIG."
          }
          EOF

      - name: Commit GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/buleleng-kecamatan.geojson
          git add data/buleleng-kecamatan-source.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan file."
            exit 0
          fi

          git commit -m "Add Buleleng district GeoJSON boundary"
          git push
